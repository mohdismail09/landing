<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohd Ismail | Custom Automation for US Service Businesses</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="description"
        content="Reliable client-operations automation for service businesses, including onboarding, reporting, lead routing, invoicing and internal handoffs.">
    <meta property="og:title" content="Mohd Ismail | Custom Automation for Service Businesses">
    <meta property="og:description"
        content="Reliable client-operations automation for service businesses, including onboarding, reporting, lead routing, invoicing and internal handoffs.">
    <meta property="og:url" content="https://mohdismail.com/">
    <link rel="canonical" href="https://mohdismail.com/">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .soft-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        .hero-gradient {
            background: radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.08) 0%, rgba(255, 255, 255, 0) 50%);
        }

        .text-gradient {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 5s ease-in-out infinite;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        @media (prefers-reduced-motion: no-preference) {
            @keyframes workflow-layer-enter {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes workflow-layer-exit {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }

                to {
                    opacity: 0;
                    transform: translateY(-6px);
                }
            }

            .workflow-layer-enter {
                animation: workflow-layer-enter 320ms cubic-bezier(0.16, 1, 0.3, 1);
            }

            .workflow-layer-exit {
                animation: workflow-layer-exit 320ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
